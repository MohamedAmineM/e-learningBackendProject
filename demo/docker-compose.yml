services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madrasati-backend
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/madrasati
      SPRING_DATASOURCE_USERNAME: madrasati
      SPRING_DATASOURCE_PASSWORD: madrasati
    networks:
      - my-network
    depends_on:
      - db

  # --- Frontend (vient de ton autre repo)
  frontend:
    image: mmnassri/madrasati-frontend       # image buildée depuis ton pipeline Jenkins frontend
    container_name: e-learningFrontCont
    ports:
      - "3000:80"
    networks:
      - my-network

  # --- Reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my-network    

  db:
    image: postgres:15
    container_name: madrasati-db
    environment:
      POSTGRES_DB: madrasati
      POSTGRES_USER: madrasati
      POSTGRES_PASSWORD: madrasati
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:            
      - my-network

volumes:
  db_data:

networks:
  my-network:
    external: true
